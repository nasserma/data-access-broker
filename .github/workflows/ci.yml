name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Tests with coverage gate (100%)
        run: uv run pytest -q tests/ --cov=data_broker --cov-branch
      # The backward-compatibility gate (core consumers' suites unchanged)
      # runs LOCALLY as a stage-close step: it needs the sibling workspace
      # trees, which do not exist on hosted CI. CI-v1 covers this repo's
      # own battery + coverage gate; see DEPLOYMENT.md for the local set.