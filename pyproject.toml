[project]
name = "data-access-broker"
version = "0.1.1"
description = "Data MCP access broker: tiered, human-gated access to file and data stores (WebDAV, OneDrive) across providers on the access-broker suite architecture."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "Nasser Mohieddin Abukhdeir" }]
dependencies = [
    "access-broker-core @ git+https://github.com/nasserma/access-broker-core@v0.1.1",
    "mcp>=2.2",
    "msal>=1.39.0",
    "pyyaml>=6",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
gateway-matrix = ["matrix-nio>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["data_broker"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "webdav4>=0.10",
    "wsgidav>=4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PL"]
ignore = [
    "PLR0913",  # many-argument signatures are expected in wiring code
    "PLR0917",  # same rationale (ported patterns)
    "PLR0912",  # wall stage ladders branch by design
    "PLR0911",
    "PLR0915",
    "C901",
]

[tool.ruff.lint.per-file-ignores]
"scratch_servers/*" = [
    "PLC0415",  # bring-up/dry-run scripts: imports stay where the flow reads
    "F841",
    "SIM105",
]
"data_broker/backends/base.py" = [
    "N818",     # NotConnected/BackendUnavailable match the suite's established exception names (automation broker precedent)
]
"tests/*" = [
    "PLR2004",
    "ARG001",
    "ARG002",
    "PLC0415",
    "E501",
    "C416",
    "PLW0108",
    "N802",
    "PLW0603",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: real-protocol tests against scratch servers (deselect with -m 'not integration')",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 93  # recorded per-module baseline (S6-3 H3 deliberate deviation): cli 81,
                 # config 83, onedrive 96, webdav 98, tools 95, base 100, total 93;
                 # raising to the suite norm 100 demands ~70 arm tests on cli/config/
                 # tools - a later stage's work, not a silent default.
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
]